<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three flow-field lines converging into a current, in the flow-field sketch's "dusk" palette.
       favicon.ico is this at 32px: inkscape favicon.svg -w 32 -o 32.png && magick 32.png favicon.ico -->
  <rect width="32" height="32" rx="7" fill="#1b1b2f" />
  <g fill="none" stroke-linecap="round" stroke-width="3.2">
    <path d="M6 8.5c7 0 11 1.5 20-3" stroke="#f7b267" />
    <path d="M6 16.5c8 0 11-3 20-6.5" stroke="#e43f5a" />
    <path d="M6 24.5c9 0 12-7.5 20-10" stroke="#5c7aea" />
  </g>
</svg>
